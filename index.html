  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03020a" />
  <title>Verifikasi Keamanan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS
    ============================================================ */
    :root {
      --space-0: #03020a;
      --space-1: #0a0620;
      --space-2: #140d33;

      --violet: #7b5cff;
      --violet-soft: #a78bfa;
      --cyan: #4fd8ff;
      --mint: #20c997;

      --gold: #ffd77a;
      --gold-2: #d4af37;
      --gold-3: #a8801d;

      --text: #eae6ff;
      --muted: #9a94bd;
      --line: rgba(160, 140, 255, 0.18);
    }

    @property --ang {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 26px 18px;
      position: relative;
      overflow-x: hidden;

      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;

      background:
        radial-gradient(1100px 750px at 50% -12%, #1d1247 0%, #0c0726 42%, #03020a 100%),
        var(--space-0);
    }

    /* ============================================================
       COSMOS LAYERS — nebulae
    ============================================================ */
    .cosmos {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .nebula {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .nebula.n1 {
      width: 78vmax; height: 78vmax;
      left: -30vmax; top: -34vmax;
      background: radial-gradient(circle at 50% 50%, rgba(103, 58, 200, 0.55), rgba(60, 25, 140, 0.18) 45%, transparent 70%);
      animation: drift1 30s ease-in-out infinite;
    }

    .nebula.n2 {
      width: 68vmax; height: 68vmax;
      right: -28vmax; top: 2vmax;
      background: radial-gradient(circle at 50% 50%, rgba(14, 109, 158, 0.5), rgba(20, 60, 140, 0.16) 45%, transparent 70%);
      animation: drift2 36s ease-in-out infinite;
    }

    .nebula.n3 {
      width: 62vmax; height: 62vmax;
      left: 10vmax; bottom: -32vmax;
      background: radial-gradient(circle at 50% 50%, rgba(180, 120, 30, 0.34), rgba(120, 60, 10, 0.12) 45%, transparent 70%);
      animation: drift3 42s ease-in-out infinite;
    }

    .nebula.n4 {
      width: 44vmax; height: 44vmax;
      right: -12vmax; bottom: -18vmax;
      background: radial-gradient(circle at 50% 50%, rgba(123, 92, 255, 0.42), transparent 68%);
      animation: drift1 34s ease-in-out infinite reverse;
    }

    @keyframes drift1 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50%      { transform: translate3d(6vmax, 4vmax, 0) scale(1.12); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1.05); }
      50%      { transform: translate3d(-5vmax, 6vmax, 0) scale(0.94); }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50%      { transform: translate3d(4vmax, -5vmax, 0) scale(1.15); }
    }

    /* ============================================================
       COSMOS LAYERS — starfield canvas
    ============================================================ */
    #galaxy {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      display: block;
    }

    /* ============================================================
       CARD
    ============================================================ */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 446px;
      padding: 46px 34px 34px;
      border-radius: 30px;
      text-align: center;
      overflow: hidden;
      isolation: isolate;

      background:
        linear-gradient(168deg,
          rgba(38, 27, 82, 0.72) 0%,
          rgba(14, 9, 34, 0.86) 48%,
          rgba(6, 4, 16, 0.94) 100%);

      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);

      box-shadow:
        0 50px 100px -24px rgba(0, 0, 0, 0.92),
        0 0 90px -30px rgba(123, 92, 255, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        inset 0 -1px 0 rgba(255, 255, 255, 0.03);

      animation: cardIn 0.95s cubic-bezier(0.2, 0.9, 0.25, 1) both;
    }

    /* rotating cosmic border */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 4;
      border-radius: inherit;
      padding: 1.3px;
      pointer-events: none;
      background: conic-gradient(from var(--ang),
        rgba(255, 215, 122, 0)    0deg,
        rgba(255, 215, 122, 0.9)  38deg,
        rgba(167, 139, 250, 0.75) 105deg,
        rgba(79, 216, 255, 0)     175deg,
        rgba(79, 216, 255, 0.75)  245deg,
        rgba(167, 139, 250, 0.6)  305deg,
        rgba(255, 215, 122, 0)    360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      animation: borderSpin 10s linear infinite;
    }

    @keyframes borderSpin { to { --ang: 360deg; } }

    /* soft inner top glow */
    .card::after {
      content: '';
      position: absolute;
      z-index: 0;
      top: -46%;
      left: 50%;
      width: 150%;
      height: 78%;
      transform: translateX(-50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(123, 92, 255, 0.30), rgba(79, 216, 255, 0.07) 45%, transparent 68%);
    }

    .card-inner {
      position: relative;
      z-index: 2;
    }

    /* ============================================================
       ORB (icon)
    ============================================================ */
    .orb {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
    }

    .orb-core {
      position: relative;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: grid;
      place-items: center;

      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.30), transparent 42%),
        radial-gradient(circle at 50% 60%, rgba(123, 92, 255, 0.45), rgba(12, 8, 30, 0.95) 72%);

      border: 1px solid rgba(255, 215, 122, 0.40);

      box-shadow:
        0 0 34px rgba(123, 92, 255, 0.55),
        0 0 70px -10px rgba(123, 92, 255, 0.45),
        inset 0 0 26px rgba(123, 92, 255, 0.38),
        0 0 0 7px rgba(123, 92, 255, 0.06);

      animation: corePulse 4.5s ease-in-out infinite;
    }

    .orb-core svg {
      width: 36px;
      height: 36px;
      fill: var(--gold);
      filter: drop-shadow(0 0 8px rgba(255, 215, 122, 0.75));
    }

    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed rgba(167, 139, 250, 0.42);
      animation: spin 16s linear infinite;
    }

    .orb-ring::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan), 0 0 26px rgba(79, 216, 255, 0.7);
    }

    .orb-ring.r2 {
      inset: 11px;
      border-style: solid;
      border-color: rgba(255, 215, 122, 0.20);
      animation: spin 24s linear infinite reverse;
    }

    .orb-ring.r2::after {
      width: 6px;
      height: 6px;
      margin-left: -3px;
      background: var(--gold);
      box-shadow: 0 0 12px var(--gold), 0 0 28px rgba(255, 215, 122, 0.65);
    }

    /* ============================================================
       TYPOGRAPHY
    ============================================================ */
    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.25;
      margin-bottom: 11px;

      background: linear-gradient(180deg, #ffffff 0%, #e9e1ff 42%, #b6a2ff 100%);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 22px rgba(167, 139, 250, 0.55));
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.68;
      color: var(--muted);
      max-width: 320px;
      margin: 0 auto;
      letter-spacing: 0.15px;
    }

    /* ============================================================
       STATUS BOX
    ============================================================ */
    .status-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 24px 0 28px;
      padding: 13px 18px;
      border-radius: 15px;
      overflow: hidden;

      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #8ef0d6;

      background: linear-gradient(120deg, rgba(79, 216, 255, 0.10), rgba(32, 201, 151, 0.07));
      border: 1px solid rgba(79, 216, 255, 0.26);
      box-shadow:
        inset 0 0 26px rgba(79, 216, 255, 0.10),
        0 0 30px -12px rgba(79, 216, 255, 0.55);
    }

    .status-box::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), transparent);
      transform: skewX(-20deg);
      animation: sweep 3.6s ease-in-out infinite;
    }

    @keyframes sweep {
      0%   { left: -60%; }
      55%  { left: 130%; }
      100% { left: 130%; }
    }

    .status-dot {
      position: relative;
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 10px var(--mint), 0 0 20px rgba(32, 201, 151, 0.65);
      animation: dotPulse 1.6s ease-in-out infinite;
    }

    /* ============================================================
       BUTTON
    ============================================================ */
    .verify-button {
      position: relative;
      width: 100%;
      min-height: 58px;
      padding: 18px 22px;
      border: 0;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      color: #1a1204;

      background: linear-gradient(135deg, #ffeeb4 0%, #ffd77a 24%, #d4af37 62%, #a8801d 100%);

      box-shadow:
        0 16px 38px -10px rgba(212, 175, 55, 0.65),
        0 0 60px -18px rgba(255, 215, 122, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.62),
        inset 0 -2px 0 rgba(0, 0, 0, 0.16);

      transition:
        transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.35),
        box-shadow 0.32s ease,
        filter 0.32s ease;
    }

    .verify-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -110%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: skewX(-22deg);
      transition: left 0.75s cubic-bezier(0.3, 0.8, 0.3, 1);
      pointer-events: none;
    }

    .verify-button:hover {
      transform: translateY(-3px);
      filter: saturate(1.12) brightness(1.05);
      box-shadow:
        0 24px 50px -12px rgba(212, 175, 55, 0.85),
        0 0 90px -14px rgba(255, 215, 122, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .verify-button:hover::before { left: 160%; }

    .verify-button:active {
      transform: translateY(0) scale(0.985);
    }

    .verify-button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    .verify-button:disabled {
      cursor: not-allowed;
      filter: grayscale(0.35) brightness(0.9);
      transform: none;
      box-shadow: 0 10px 26px -12px rgba(212, 175, 55, 0.5);
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(26, 18, 4, 0.22);
      border-top-color: #1a1204;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading .spinner { display: block; }
    .loading .btn-text { display: none; }

    /* ============================================================
       TRUST FOOTER
    ============================================================ */
    .trust-footer {
      margin-top: 28px;
      padding-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(160, 140, 255, 0.13);
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #8d86b3;
      background: rgba(255, 255, 255, 0.028);
      border: 1px solid rgba(160, 140, 255, 0.15);
      transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }

    .trust-item:hover {
      color: var(--gold);
      border-color: rgba(255, 215, 122, 0.4);
      background: rgba(255, 215, 122, 0.06);
    }

    .trust-item svg {
      width: 13px;
      height: 13px;
      fill: var(--gold-2);
      flex: none;
    }

    /* ============================================================
       KEYFRAMES
    ============================================================ */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(36px) scale(0.94); filter: blur(8px); }
      to   { opacity: 1; transform: translateY(0) scale(1);      filter: blur(0); }
    }

    @keyframes corePulse {
      0%, 100% { box-shadow: 0 0 34px rgba(123,92,255,.55), 0 0 70px -10px rgba(123,92,255,.45), inset 0 0 26px rgba(123,92,255,.38), 0 0 0 7px rgba(123,92,255,.06); }
      50%      { box-shadow: 0 0 46px rgba(123,92,255,.75), 0 0 100px -8px rgba(123,92,255,.6), inset 0 0 32px rgba(123,92,255,.5), 0 0 0 12px rgba(123,92,255,.03); }
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.55); opacity: 0.45; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 420px) {
      .card { padding: 38px 24px 28px; border-radius: 26px; }
      .title { font-size: 23px; }
      .subtitle { font-size: 13.5px; }
      .orb { width: 96px; height: 96px; margin-bottom: 22px; }
      .orb-core { width: 68px; height: 68px; }
      .orb-core svg { width: 31px; height: 31px; }
      .verify-button { font-size: 13px; letter-spacing: 1.3px; min-height: 54px; }
    }

    @media (max-height: 700px) {
      .card { padding-top: 34px; padding-bottom: 26px; }
      .orb { width: 88px; height: 88px; margin-bottom: 18px; }
      .orb-core { width: 64px; height: 64px; }
      .orb-core svg { width: 29px; height: 29px; }
      .status-box { margin: 18px 0 22px; }
      .trust-footer { margin-top: 20px; padding-top: 16px; }
    }

    /* ============================================================
       REDUCED MOTION
    ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ===== GALAXY BACKGROUND ===== -->
  <div class="cosmos" aria-hidden="true">
    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    <div class="nebula n3"></div>
    <div class="nebula n4"></div>
  </div>
  <canvas id="galaxy" aria-hidden="true"></canvas>

  <!-- ===== CARD ===== -->
  <main class="card">
    <div class="card-inner">

      <div class="orb">
        <div class="orb-ring"></div>
        <div class="orb-ring r2"></div>
        <div class="orb-core">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 11.99H19C18.47 16.11 15.72 19.78 12 20.93V12H5V6.3L12 3.19V11.99Z"/>
          </svg>
        </div>
      </div>

      <h1 class="title">Verifikasi Keamanan</h1>
      <p class="subtitle">Sistem mendeteksi koneksi aman. Silakan verifikasi untuk melanjutkan.</p>

      <div class="status-box">
        <span class="status-dot"></span>
        <span>Koneksi Terenkripsi &amp; Aman</span>
      </div>

      <button class="verify-button" id="buyButton" type="button">
        <span class="btn-text">Verifikasi &amp; Lanjutkan</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <div class="trust-footer">
        <div class="trust-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C9.243 2 7 4.243 7 7V10H6C4.897 10 4 10.897 4 12V20C4 21.103 4.897 22 6 22H18C19.103 22 20 21.103 20 20V12C20 10.897 19.103 10 18 10H17V7C17 4.243 14.757 2 12 2ZM12 4C13.654 4 15 5.346 15 7V10H9V7C9 5.346 10.346 4 12 4ZM12 14C13.103 14 14 14.897 14 16C14 17.103 13.103 18 12 18C10.897 18 10 17.103 10 16C10 14.897 10.897 14 12 14Z"/></svg>
          <span>SSL Terenkripsi</span>
        </div>
        <div class="trust-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 11.99H19C18.47 16.11 15.72 19.78 12 20.93V12H5V6.3L12 3.19V11.99Z"/></svg>
          <span>Terverifikasi</span>
        </div>
      </div>

    </div>
  </main>

  <!-- ============================================================
       GALAXY STARFIELD ENGINE
  ============================================================ -->
  <script>
  (function () {
    "use strict";

    var canvas = document.getElementById('galaxy');
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');

    var W = 0, H = 0, DPR = 1;
    var stars = [];
    var shooters = [];
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var running = true;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width  = Math.floor(window.innerWidth  * DPR);
      H = canvas.height = Math.floor(window.innerHeight * DPR);
      canvas.style.width  = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      buildStars();
      if (reduced) render(0);
    }

    function buildStars() {
      var count = Math.min(420, Math.round((window.innerWidth * window.innerHeight) / 5200));
      stars = [];
      for (var i = 0; i < count; i++) {
        var depth = Math.random();
        var huePick = Math.random();
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: (0.30 + depth * 1.45) * DPR,
          base: 0.22 + Math.random() * 0.62,
          phase: Math.random() * Math.PI * 2,
          speed: 0.4 + Math.random() * 1.3,
          vx: (Math.random() - 0.5) * 0.055 * DPR,
          vy: (Math.random() - 0.5) * 0.055 * DPR,
          hue: huePick < 0.16 ? 45 : (huePick < 0.60 ? 265 : 195)
        });
      }
    }

    function spawnShooter() {
      if (shooters.length >= 3) return;
      var angle = Math.PI / 5.2 + Math.random() * 0.22;
      shooters.push({
        x: Math.random() * W * 0.85,
        y: Math.random() * H * 0.35,
        len: (130 + Math.random() * 200) * DPR,
        speed: (6.5 + Math.random() * 5) * DPR,
        angle: angle,
        life: 1
      });
    }

    function render(t) {
      ctx.clearRect(0, 0, W, H);

      /* --- stars --- */
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];

        if (!reduced) {
          s.x += s.vx;
          s.y += s.vy;
          if (s.x < -6) s.x = W + 6;
          if (s.x > W + 6) s.x = -6;
          if (s.y < -6) s.y = H + 6;
          if (s.y > H + 6) s.y = -6;
        }

        var a = reduced
          ? s.base
          : s.base + Math.sin(t * 0.001 * s.speed + s.phase) * 0.34;
        if (a < 0.05) a = 0.05;
        if (a > 1) a = 1;

        /* glow halo on larger stars */
        if (s.r > 1.35 * DPR) {
          var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 7);
          g.addColorStop(0, 'hsla(' + s.hue + ', 95%, 76%, ' + (a * 0.34) + ')');
          g.addColorStop(1, 'hsla(' + s.hue + ', 95%, 76%, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 7, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.fillStyle = 'hsla(' + s.hue + ', 96%, 82%, ' + a + ')';
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      /* --- shooting stars --- */
      if (!reduced) {
        if (Math.random() < 0.0065) spawnShooter();

        for (var k = shooters.length - 1; k >= 0; k--) {
          var sh = shooters[k];
          sh.x += Math.cos(sh.angle) * sh.speed;
          sh.y += Math.sin(sh.angle) * sh.speed;
          sh.life -= 0.0115;

          if (sh.life <= 0 || sh.x > W + 400 || sh.y > H + 400) {
            shooters.splice(k, 1);
            continue;
          }

          var tx = sh.x - Math.cos(sh.angle) * sh.len;
          var ty = sh.y - Math.sin(sh.angle) * sh.len;

          var lg = ctx.createLinearGradient(sh.x, sh.y, tx, ty);
          lg.addColorStop(0,    'rgba(255,255,255,' + (0.92 * sh.life) + ')');
          lg.addColorStop(0.28, 'rgba(167,139,250,' + (0.55 * sh.life) + ')');
          lg.addColorStop(0.65, 'rgba(79,216,255,'  + (0.22 * sh.life) + ')');
          lg.addColorStop(1,    'rgba(79,216,255,0)');

          ctx.strokeStyle = lg;
          ctx.lineWidth = 1.9 * DPR;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(sh.x, sh.y);
          ctx.lineTo(tx, ty);
          ctx.stroke();

          /* bright head */
          ctx.beginPath();
          ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * sh.life) + ')';
          ctx.arc(sh.x, sh.y, 1.7 * DPR, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function loop(t) {
      if (!running) return;
      render(t);
      requestAnimationFrame(loop);
    }

    /* pause when tab hidden (saves battery) */
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        running = false;
      } else if (!reduced) {
        running = true;
        requestAnimationFrame(loop);
      }
    });

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 140);
    });

    resize();
    if (!reduced) requestAnimationFrame(loop);

  })();
  </script>

        var isIPadOS = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        // Deteksi umum mobile lain (fallback)
        var isGenericMobile = /Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);

        return isAndroid || isIPhone || isIPadOS || isGenericMobile;
