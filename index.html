  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifikasi Keamanan</title>
  
  <!-- Import Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #0a0a0a;
      --black-soft: #141414;
      --gold: #d4af37;
      --gold-light: #f3c25b;
      --gold-dark: #9b7a1c;
      --white: #ffffff;
      --muted: #a0a0a0;
      --line: rgba(212, 175, 55, 0.3);
      --glass: rgba(20, 20, 20, 0.7);
      --green: #20c997;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-color: var(--black);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.08), transparent 25%);
      font-family: 'Inter', sans-serif;
      color: var(--white);
      overflow-x: hidden;
    }

    .card {
      position: relative;
      background: var(--glass);
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      border: 1px solid var(--line);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      padding: 40px 30px;
      text-align: center;
      animation: cardIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .security-icon {
      width: 80px; height: 80px; margin: 0 auto 20px;
      background: rgba(212, 175, 55, 0.1); border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      border: 1px solid var(--line); position: relative;
      animation: pulseIcon 3s infinite;
    }
    .security-icon svg { width: 40px; height: 40px; fill: var(--gold-light); }

    .title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--white); margin-bottom: 10px; }
    .subtitle { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 25px; }

    .status-box {
      background: rgba(32, 201, 151, 0.1); border: 1px solid rgba(32, 201, 151, 0.3);
      border-radius: 8px; padding: 12px; margin-bottom: 25px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; color: var(--green);
    }
    .status-dot { width: 8px; height: 8px; background-color: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }

    .verify-button {
      position: relative; width: 100%; padding: 18px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      color: #1a1a1a; font-size: 16px; font-weight: 700; cursor: pointer; overflow: hidden;
      transition: all 0.3s ease; box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      text-transform: uppercase; letter-spacing: 1px;
      display: flex; justify-content: center; align-items: center; min-height: 56px;
    }
    .verify-button::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: skewX(-20deg); transition: all 0.6s ease;
    }
    .verify-button:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(212, 175, 55, 0.5); }
    .verify-button:hover::before { left: 150%; }
    .verify-button:active { transform: translateY(1px); }
    .verify-button:disabled { filter: grayscale(0.5); cursor: not-allowed; transform: none; }

    .trust-footer { margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 15px; font-size: 11px; color: #666; }
    .trust-item { display: flex; align-items: center; gap: 5px; }
    .trust-item svg { width: 14px; height: 14px; fill: var(--gold); }

    @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes pulseIcon { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

    .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.2); border-top-color: #1a1a1a; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .spinner { display: block; }
    .loading .btn-text { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="security-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 11.99H19C18.47 16.11 15.72 19.78 12 20.93V12H5V6.3L12 3.19V11.99Z"/></svg>
    </div>

    <h2 class="title">Verifikasi Keamanan</h2>
    <p class="subtitle">Sistem mendeteksi koneksi aman. Silakan verifikasi untuk melanjutkan ke halaman pendaftaran.</p>

    <div class="status-box">
      <div class="status-dot"></div>
      <span>Koneksi Terenkripsi & Aman</span>
    </div>

    <button class="verify-button" id="buyButton">
      <span class="btn-text">Verifikasi & Lanjutkan</span>
      <div class="spinner"></div>
    </button>

    <div class="trust-footer">
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C9.243 2 7 4.243 7 7V10H6C4.897 10 4 10.897 4 12V20C4 21.103 4.897 22 6 22H18C19.103 22 20 21.103 20 20V12C20 10.897 19.103 10 18 10H17V7C17 4.243 14.757 2 12 2ZM12 4C13.654 4 15 5.346 15 7V10H9V7C9 5.346 10.346 4 12 4ZM12 14C13.103 14 14 14.897 14 16C14 17.103 13.103 18 12 18C10.897 18 10 17.103 10 16C10 14.897 10.897 14 12 14Z"/></svg>
        <span>SSL Terenkripsi</span>
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 11.99H19C18.47 16.11 15.72 19.78 12 20.93V12H5V6.3L12 3.19V11.99Z"/></svg>
        <span>Terverifikasi</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ==========================================
      // 1. PENGATURAN UTAMA
      // ==========================================
      var TUJUAN_URL = "https://pafimalang.org/register?referral=jonathannn";
      var productId = "PAFI_MALANG_VIP";
      
      // PERBAIKAN: Ubah value menjadi angka yang valid (bukan 0)
      var price = 150000; 
      var currency = "IDR";

      // ==========================================
      // 2. LOGIKA PELACAKAN PIXEL & TOMBOL
      // ==========================================
      var button = document.getElementById("buyButton");
      var eventId = 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

      // Tembak ViewContent saat halaman dimuat
      window.addEventListener('load', function() {
        if (typeof window.fbq === "function") {
          window.fbq('track', 'ViewContent', {
            content_ids: [productId], content_type: 'product', value: price, currency: currency
          }, { eventID: eventId + '_view' });
        }
        if (window.ttq && typeof window.ttq.track === "function") {
          window.ttq.track('ViewContent', {
            content_id: productId, content_type: 'product', value: price, currency: currency
          }, { event_id: eventId + '_view' });
        }
      });

      // Aksi saat tombol diklik
      button.addEventListener("click", function() {
        button.disabled = true;
        button.classList.add("loading");

        // Tembak AddToCart
        if (typeof window.fbq === "function") {
          window.fbq('track', 'AddToCart', { content_ids: [productId], value: price, currency: currency }, { eventID: eventId + '_atc' });
        }
        if (window.ttq) {
          window.ttq.track('AddToCart', { content_id: productId, value: price, currency: currency }, { event_id: eventId + '_atc' });
        }

        // Jeda 0.4 detik, lalu InitiateCheckout
        setTimeout(function() {
          if (typeof window.fbq === "function") {
            window.fbq('track', 'InitiateCheckout', { content_ids: [productId], value: price, currency: currency }, { eventID: eventId + '_ic' });
          }
          if (window.ttq) {
            window.ttq.track('InitiateCheckout', { content_id: productId, value: price, currency: currency }, { event_id: eventId + '_ic' });
          }

          // Jeda 0.4 detik lagi, lalu Purchase / CompletePayment
          setTimeout(function() {
            if (typeof window.fbq === "function") {
              window.fbq('track', 'Purchase', { content_ids: [productId], value: price, currency: currency }, { eventID: eventId + '_pur' });
            }
            if (window.ttq) {
              window.ttq.track('CompletePayment', { content_id: productId, value: price, currency: currency }, { event_id: eventId + '_pur' });
            }

            // Jeda 1.5 detik agar data terkirim ke server, lalu redirect
            setTimeout(function() {
              window.location.href = TUJUAN_URL;
            }, 1500);

          }, 400); 
        }, 400); 
      });

    })();
  </script>
</body>
</html>
