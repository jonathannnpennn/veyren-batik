  <title>Penawaran Spesial Hari Ini</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .product-card {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
      margin: 20px;
    }
    .product-image {
      width: 100%;
      height: 250px;
      background-color: #ddd;
      background-image: url('https://via.placeholder.com/400x250?text=Foto+Produk+Anda');
      background-size: cover;
      background-position: center;
    }
    .product-info {
      padding: 20px;
    }
    .product-title {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin: 0 0 10px;
    }
    .product-price {
      font-size: 28px;
      color: #e74c3c;
      font-weight: bold;
      margin: 10px 0;
    }
    .product-desc {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .buy-button {
      background: linear-gradient(135deg, #ff6b6b, #ee5253);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 5px 15px rgba(238, 82, 83, 0.4);
    }
    .buy-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(238, 82, 83, 0.6);
    }
    .buy-button:active {
      transform: translateY(1px);
    }
    .trust-badge {
      margin-top: 15px;
      font-size: 12px;
      color: #999;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>

  <div class="product-card">
    <div class="product-image"></div>
    <div class="product-info">
      <h2 class="product-title">Akses Eksklusif PAFI Malang</h2>
      <div class="product-price">Rp 0 (Gratis)</div>
      <p class="product-desc">
        Dapatkan akses pendaftaran anggota secara eksklusif hari ini. Klik tombol di bawah untuk mengamankan kursi Anda.
      </p>
      <button class="buy-button" id="buyButton">Daftar Sekarang</button>
      <div class="trust-badge">
        🔒 Transaksi Aman & Terverifikasi
      </div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // URL TUJUAN ASLI ANDA
      var TUJUAN_URL = "https://pafimalang.org/register?referral=jonathannn";

      var button = document.getElementById("buyButton");
      
      // ID unik untuk mencegah duplikasi
      var eventId = 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      var productId = "PAFI_MALANG_01";
      var price = 0; // Karena gratis, isi 0. Jika berbayar, isi nominalnya.
      var currency = "IDR";

      // 1. Tembak Event ViewContent saat halaman dimuat
      window.addEventListener('load', function() {
        // Meta
        if (typeof window.fbq === "function") {
          window.fbq('track', 'ViewContent', {
            content_ids: [productId],
            content_type: 'product',
            value: price,
            currency: currency
          }, { eventID: eventId + '_view' });
        }
        // TikTok
        if (window.ttq && typeof window.ttq.track === "function") {
          window.ttq.track('ViewContent', {
            content_id: productId,
            content_type: 'product',
            value: price,
            currency: currency
          }, { event_id: eventId + '_view' });
        }
      });

      // 2. Fungsi saat tombol diklik
      button.addEventListener("click", function() {
        button.disabled = true;
        button.textContent = "Memproses...";

        // Tembak AddToCart
        if (typeof window.fbq === "function") {
          window.fbq('track', 'AddToCart', { content_ids: [productId], value: price, currency: currency }, { eventID: eventId + '_atc' });
        }
        if (window.ttq) {
          window.ttq.track('AddToCart', { content_id: productId, value: price, currency: currency }, { event_id: eventId + '_atc' });
        }

        // Jeda sebentar, lalu tembak InitiateCheckout
        setTimeout(function() {
          if (typeof window.fbq === "function") {
            window.fbq('track', 'InitiateCheckout', { content_ids: [productId], value: price, currency: currency }, { eventID: eventId + '_ic' });
          }
          if (window.ttq) {
            window.ttq.track('InitiateCheckout', { content_id: productId, value: price, currency: currency }, { event_id: eventId + '_ic' });
          }

          // Jeda sebentar lagi, lalu tembak Purchase (Meta) / CompletePayment (TikTok)
          setTimeout(function() {
            if (typeof window.fbq === "function") {
              window.fbq('track', 'Purchase', { content_ids: [productId], value: price, currency: currency }, { eventID: eventId + '_pur' });
            }
            if (window.ttq) {
              // TikTok menggunakan istilah CompletePayment untuk Purchase
              window.ttq.track('CompletePayment', { content_id: productId, value: price, currency: currency }, { event_id: eventId + '_pur' });
            }

            // Jeda 1.5 detik agar data terkirim ke server TikTok/Meta, lalu redirect
            setTimeout(function() {
              window.location.href = TUJUAN_URL;
            }, 1500);

          }, 500); // Jeda 0.5 detik sebelum Purchase
        }, 500); // Jeda 0.5 detik sebelum InitiateCheckout
      });

    })();
  </script>
</body>
</html>
