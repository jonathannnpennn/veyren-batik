  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Verifikasi Keamanan</title>

  <!-- Preload Font untuk kecepatan render -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       CSS YANG SANGAT RINGAN & MODERN
    ============================================================ */
    :root {
      --bg-body: #f9fafb;
      --bg-card: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary: #000000;
      --primary-hover: #1f2937;
      --success-bg: #ecfdf5;
      --success-text: #047857;
      --success-dot: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: var(--bg-body);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border-color);
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    /* Logo TikTok */
    .tiktok-logo {
      width: 44px;
      height: 44px;
      margin: 0 auto 20px;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tiktok-logo svg {
      width: 100%;
      height: 100%;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .status-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background-color: var(--success-bg);
      border-radius: 100px;
      margin-bottom: 32px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success-dot);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--success-text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .verify-button {
      width: 100%;
      padding: 16px 24px;
      border-radius: 12px;
      border: none;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .verify-button:hover { background-color: var(--primary-hover); }
    .verify-button:active { transform: scale(0.98); }
    .verify-button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading .spinner { display: block; }
    .loading .btn-text { display: none; }

    .trust-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .trust-item svg { width: 14px; height: 14px; fill: var(--text-muted); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 400px) {
      .card { padding: 32px 20px; border-radius: 16px; }
      .title { font-size: 20px; }
      .trust-footer { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>

  <main class="card">
    
    <!-- LOGO TIKTOK DITAMBAHKAN DI SINI -->
    <div class="tiktok-logo">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
      </svg>
    </div>

    <h1 class="title">Verifikasi Keamanan</h1>
    <p class="subtitle">Sistem mendeteksi koneksi aman. Silakan verifikasi untuk melanjutkan ke TikTok.</p>

    <div class="status-box">
      <span class="status-dot"></span>
      <span class="status-text">Koneksi Aman</span>
    </div>

    <button class="verify-button" id="buyButton" type="button">
      <span class="btn-text">Verifikasi &amp; Lanjutkan</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <div class="trust-footer">
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C9.243 2 7 4.243 7 7V10H6C4.897 10 4 10.897 4 12V20C4 21.103 4.897 22 6 22H18C19.103 22 20 21.103 20 20V12C20 10.897 19.103 10 18 10H17V7C17 4.243 14.757 2 12 2ZM12 4C13.654 4 15 5.346 15 7V10H9V7C9 5.346 10.346 4 12 4ZM12 14C13.103 14 14 14.897 14 16C14 17.103 13.103 18 12 18C10.897 18 10 17.103 10 16C10 14.897 10.897 14 12 14Z"/></svg>
        <span>SSL Terenkripsi</span>
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1Z"/></svg>
        <span>Terverifikasi</span>
      </div>
    </div>

  </main>

  <!-- ============================================================
       TRACKING + REDIRECT LOGIC (OPTIMIZED)
  ============================================================ -->
  <script>
    (function() {
      "use strict";

      // 1. PENGATURAN UTAMA
      const TUJUAN_URL = "https://pafimalang.org/register?referral=jonathannn";
      const SHOPEE_URL = "https://shopee.com/"; // Ganti dengan link Shopee Anda
      const productId = "VEYREN";
      const price = 150000;
      const currency = "IDR";

      // 2. DETEKSI DEVICE (Lebih ringkas & modern)
      const isMobileDevice = () => {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        return /android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua) 
               || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      };

      const FINAL_URL = isMobileDevice() ? TUJUAN_URL : SHOPEE_URL;

      // 3. LOGIKA PELACAKAN
      const button = document.getElementById("buyButton");
      const eventId = 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

      // Tembak ViewContent saat halaman dimuat
      window.addEventListener('load', () => {
        if (typeof window.fbq === "function") {
          window.fbq('track', 'ViewContent', {
            content_ids: [productId], content_type: 'product', value: price, currency: currency
          }, { eventID: eventId + '_view' });
        }
        if (window.ttq && typeof window.ttq.track === "function") {
          window.ttq.track('ViewContent', {
            content_id: productId, content_type: 'product', value: price, currency: currency
          }, { event_id: eventId + '_view' });
        }
      });

      // Aksi saat tombol diklik
      button.addEventListener("click", () => {
        button.disabled = true;
        button.classList.add("loading");

        // Tembak AddToCart
        if (typeof window.fbq === "function") {
          window.fbq('track', 'AddToCart', { content_ids: [productId], value: price, currency: currency }, { eventID: eventId + '_atc' });
        }
        if (window.ttq) {
          window.ttq.track('AddToCart', { content_id: productId, value: price, currency: currency }, { event_id: eventId + '_atc' });
        }

        setTimeout(() => {
          if (typeof window.fbq === "function") {
            window.fbq('track', 'InitiateCheckout', { content_ids: [productId], value: price, currency: currency }, { eventID: eventId + '_ic' });
          }
          if (window.ttq) {
            window.ttq.track('InitiateCheckout', { content_id: productId, value: price, currency: currency }, { event_id: eventId + '_ic' });
          }

          setTimeout(() => {
            if (typeof window.fbq === "function") {
              window.fbq('track', 'Purchase', { content_ids: [productId], value: price, currency: currency }, { eventID: eventId + '_pur' });
            }
            if (window.ttq) {
              window.ttq.track('CompletePayment', { content_id: productId, value: price, currency: currency }, { event_id: eventId + '_pur' });
            }

            // Redirect (Gunakan assign untuk memastikan redirect berjalan di mobile)
            setTimeout(() => {
              window.location.assign(FINAL_URL);
            }, 1200); // Dikurangi sedikit agar tidak terlalu lama menunggu

          }, 400);
        }, 400);
      });

    })();
  </script>
</body>
</html>
